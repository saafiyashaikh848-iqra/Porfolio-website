<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Revolving name</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, rgb(207, 191, 226) 20%, rgb(75, 74, 74) 80%);
            overflow: hidden;
            perspective: 600px;
            position: relative;
        }

        /* Creating the smoke effect */
        .smoke {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgb(185, 128, 128) 30%, transparent 80%);
            animation: smokeMove 6s infinite alternate ease-in-out;
        }

        @keyframes smokeMove {
            0% { transform: translateX(-10px) translateY(-10px); opacity: 0.6; }
            100% { transform: translateX(10px) translateY(10px); opacity: 0.7; }
        }

        .container {
            position: relative;
            width: 200px;
            height: 100px;
            transform-style: preserve-3d;
            animation: rotate 5s linear infinite;
        }

        .text {
            position: absolute;
            width: 200px;
            height: 100px;
            font-size: 40px;
            font-weight: bold;
            color: rgb(255, 247, 247);
            text-align: center;
            line-height: 100px;
            transform: translateZ(100px);
            text-shadow: 0 0 20px rgba(225, 185, 240, 0.8), 0 0 30px rgb(225, 209, 227);
        }

        @keyframes rotate {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="smoke"></div>
    <div class="container">
        <div class="text">Saafiya</div>
    </div>
</body>
</html>

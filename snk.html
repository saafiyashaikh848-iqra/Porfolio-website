<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Classic Snake Game</title>
<style>
  /* Reset and layout */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body, html {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=80') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f0f0f0;
    user-select: none;
  }
  #gameContainer {
    background: rgba(0,0,0,0.6);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 30px 5px #00ff90;
    text-align: center;
  }
  canvas {
    background: #111;
    display: block;
    margin: 0 auto 15px;
    border-radius: 12px;
    box-shadow: 0 0 15px #00ff90;
  }
  #score {
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 15px;
  }
  #gameOverMsg {
    font-size: 1.8rem;
    margin: 20px 0 15px;
    color: #ff4c4c;
  }
  #restartBtn {
    background-color: #00ff90;
    border: none;
    padding: 10px 25px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  #restartBtn:hover {
    background-color: #00c76f;
  }
  /* Responsive */
  @media (max-width: 600px){
    canvas {
      width: 300px !important;
      height: 300px !important;
    }
  }
</style>
</head>
<body>
  <div id="gameContainer" role="main" aria-label="Snake Game">
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400" tabindex="0" aria-label="Snake game canvas"></canvas>
    <div id="gameOverMsg" role="alert" aria-live="assertive" style="display:none;">Game Over!</div>
    <button id="restartBtn" style="display:none;">Restart</button>
  </div>

<script>
  (function(){
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('gameOverMsg');
    const restartBtn = document.getElementById('restartBtn');

    // Game Variables
    const gridSize = 20; // size of one cell
    const tileCount = canvas.width / gridSize;

    let snake = [
      {x: 9, y: 9},
      {x: 8, y: 9},
      {x: 7, y: 9}
    ];

    let velocity = {x: 1, y: 0}; // moving right initially
    let food = {x: 15, y: 15};
    let score = 0;
    let gameOver = false;
    let lastMoveTime = 0;
    const moveInterval = 100; // snake moves every 100ms

    function drawBG() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#00ff90' : '#00aa5d'; // Head brighter color
        ctx.strokeStyle = '#00331a';
        ctx.lineWidth = 2;
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
        ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
      });
    }

    function drawFood() {
      ctx.fillStyle = '#ff4c4c';
      ctx.shadowColor = '#ff4c4c';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      const centerX = food.x * gridSize + gridSize/2;
      const centerY = food.y * gridSize + gridSize/2;
      const radius = gridSize/2 - 3;
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function moveSnake() {
      const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

      // Check wall collision
      if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount){
        endGame();
        return;
      }
      // Check self collision
      if(snake.some(segment => segment.x === head.x && segment.y === head.y)){
        endGame();
        return;
      }

      snake.unshift(head);

      // Check if food eaten
      if(head.x === food.x && head.y === food.y){
        score++;
        scoreEl.textContent = 'Score: ' + score;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function placeFood() {
      let newFoodPos;
      do {
        newFoodPos = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(segment => segment.x === newFoodPos.x && segment.y === newFoodPos.y));
      food = newFoodPos;
    }

    function endGame() {
      gameOver = true;
      gameOverEl.style.display = 'block';
      restartBtn.style.display = 'inline-block';
      canvas.blur();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function gameLoop(timestamp) {
      if(gameOver) return;

      if (!lastMoveTime) lastMoveTime = timestamp;
      const delta = timestamp - lastMoveTime;

      if (delta > moveInterval) {
        moveSnake();
        lastMoveTime = timestamp;
      }

      clearCanvas();
      drawBG();
      drawSnake();
      drawFood();
      requestAnimationFrame(gameLoop);
    }

    // Input handling
    document.addEventListener('keydown', e => {
      if(gameOver) return;

      // Prevent reverse direction
      const lastVelocity = velocity;
      switch(e.key){
        case 'ArrowUp':
        case 'w':
          if(lastVelocity.y === 1) break;
          velocity = {x:0, y:-1};
          break;
        case 'ArrowDown':
        case 's':
          if(lastVelocity.y === -1) break;
          velocity = {x:0, y:1};
          break;
        case 'ArrowLeft':
        case 'a':
          if(lastVelocity.x === 1) break;
          velocity = {x:-1, y:0};
          break;
        case 'ArrowRight':
        case 'd':
          if(lastVelocity.x === -1) break;
          velocity = {x:1, y:0};
          break;
      }
    });

    restartBtn.addEventListener('click', () => {
      gameOver = false;
      snake = [
        {x: 9, y: 9},
        {x: 8, y: 9},
        {x: 7, y: 9}
      ];
      velocity = {x:1, y:0};
      score = 0;
      scoreEl.textContent = 'Score: 0';
      gameOverEl.style.display = 'none';
      restartBtn.style.display = 'none';
      placeFood();
      canvas.focus();
      requestAnimationFrame(gameLoop);
    });

    // Initialization
    placeFood();
    canvas.focus();
    requestAnimationFrame(gameLoop);
  })();
</script>
</body>
</html>
